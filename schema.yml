      operationId: xizmatlarim_list
      description: Usta o'z xizmatlarini (kategoriya, narx, tajriba) boshqaradi.
      tags:
      - xizmatlarim
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
