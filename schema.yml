          description: No response body
components:
  schemas:
    Ariza:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        mijoz:
          type: string
          readOnly: true
        usta:
          allOf:
          - $ref: '#/components/schemas/UstaQisqa'
          readOnly: true
        kategoriya:
          type: string
          readOnly: true
        tavsif:
          type: string
        manzil:
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/StatusEnum'
        status_nomi:
          type: string
          readOnly: true
        kelishilgan_narx:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        sharh:
          allOf:
          - $ref: '#/components/schemas/Sharh'
          readOnly: true
        yaratilgan:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - kategoriya
      - manzil
      - mijoz
      - sharh
      - status_nomi
      - tavsif
      - usta
      - yaratilgan
    ArizaCreateRequest:
      type: object
      properties:
        usta:
          type: integer
        kategoriya:
          type: integer
        tavsif:
          type: string
          minLength: 1
        manzil:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - kategoriya
      - manzil
      - tavsif
      - usta
    Kategoriya:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nomi:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - nomi
      - slug
    KategoriyaRequest:
      type: object
      properties:
        nomi:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - nomi
      - slug
    LoginRequest:
      type: object
      description: Kirishda ham telefon ro'yxatdan o'tishdagi kabi tozalanadi.
      properties:
        telefon:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - telefon
    PatchedArizaUpdateRequest:
      type: object
      description: |-
        Mijoz arizani faqat "yangi" holatida tahrirlay oladi.
        status, usta va kelishilgan_narx ataylab kiritilmagan: ular faqat action'lar orqali o'zgaradi.
      properties:
        tavsif:
          type: string
          minLength: 1
        manzil:
          type: string
          minLength: 1
          maxLength: 255
    PatchedUserRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
    PatchedUstaUpdateRequest:
      type: object
      description: Usta o'z profilini tahrirlashi uchun. `tasdiqlangan` ataylab kiritilmagan.
      properties:
        shahar:
          type: integer
        tavsif:
          type: string
    PatchedXizmatimRequest:
      type: object
      description: Usta o'z xizmatlarini boshqarishi uchun (/xizmatlarim/).
      properties:
        kategoriya_id:
          type: integer
          writeOnly: true
        narx_dan:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        tajriba:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Yil
    QabulRequest:
      type: object
      properties:
        kelishilgan_narx:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
    RegisterJavob:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/Tokenlar'
      required:
      - tokens
      - user
    RegisterRequest:
      type: object
      properties:
        telefon:
          type: string
          minLength: 1
          pattern: ^\+998\d{9}$
          maxLength: 13
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        password2:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - password2
      - telefon
    Shahar:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nomi:
          type: string
          maxLength: 100
      required:
      - id
      - nomi
    Sharh:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        baho:
          type: integer
          maximum: 5
          minimum: 1
        matn:
          type: string
        yaratilgan:
          type: string
          format: date-time
          readOnly: true
      required:
      - baho
      - id
      - yaratilgan
    SharhRequest:
      type: object
      properties:
        baho:
          type: integer
          maximum: 5
          minimum: 1
        matn:
          type: string
      required:
      - baho
    StatusEnum:
      enum:
      - yangi
      - qabul
      - bajarildi
      - bekor
      type: string
      description: |-
        * `yangi` - Yangi
        * `qabul` - Qabul qilindi
        * `bajarildi` - Bajarildi
        * `bekor` - Bekor qilindi
    TokenBlacklistRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    Tokenlar:
      type: object
      properties:
