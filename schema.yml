openapi: 3.0.3
info:
  title: Usta API
  version: 1.0.0
  description: Ustalarni topish va ularga ariza qoldirish platformasi
paths:
  /api/v1/arizalar/:
    get:
      operationId: arizalar_list
      tags:
      - arizalar
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ariza'
          description: ''
    post:
      operationId: arizalar_create
      tags:
      - arizalar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArizaCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArizaCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArizaCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ariza'
          description: ''
  /api/v1/arizalar/{id}/:
    get:
      operationId: arizalar_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Ariza.
        required: true
      tags:
      - arizalar
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ariza'
          description: ''
    patch:
      operationId: arizalar_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Ariza.
        required: true
      tags:
      - arizalar
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArizaUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArizaUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArizaUpdateRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ariza'
          description: ''
  /api/v1/arizalar/{id}/bajarildi/:
