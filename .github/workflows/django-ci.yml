name: Django CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Bir branch'ga ketma-ket push qilinsa, eskisi bekor qilinadi
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'

jobs:
  # ---------- 1. Kod sifati ----------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements/dev.txt

      - name: ruff check
        run: ruff check .

  # ---------- 2. Testlar va migratsiyalar ----------
  test:
    name: Testlar
    runs-on: ubuntu-latest
    needs: lint

    # Migratsiyalar haqiqiy PostgreSQL'da tekshiriladi (production'dagi bilan bir xil baza)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: usta
          POSTGRES_USER: usta
          POSTGRES_PASSWORD: usta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U usta -d usta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-uchun-vaqtinchalik-maxfiy-kalit-0123456789abcdef
      DATABASE_URL: postgres://usta:usta@localhost:5432/usta
      DJANGO_SETTINGS_MODULE: config.settings.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements/dev.txt

      - name: Django tekshiruvi
        run: python manage.py check

      - name: Yozilmay qolgan migratsiya yo'qligini tekshirish
        run: python manage.py makemigrations --check --dry-run

      - name: Migratsiyalarni PostgreSQL'ga qo'llash
        run: python manage.py migrate --noinput

      - name: OpenAPI sxemasini tekshirish
        run: python manage.py spectacular --file schema.yml --validate --fail-on-warn

      - name: Testlar (qamrov bilan)
        run: pytest --ds=config.settings.test --cov --cov-report=term

  # ---------- 3. Docker image: qurish, sinash, GHCR'ga yuklash ----------
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Image teglari
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Image'ni qurish
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container ishga tushadimi, /health/ javob beradimi)
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name smoke -p 8000:8000 \
            -e SECRET_KEY=smoke-test-uchun-vaqtinchalik-kalit-0123456789 \
            -e HTTPS=False \
            -e ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            "$IMAGE"
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health/; then echo; exit 0; fi
            sleep 2
          done
          echo "Container javob bermadi"; docker logs smoke; exit 1

      - name: GitHub Container Registry'ga kirish
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image'ni yuklash (faqat master'ga push bo'lganda)
        if: github.event_name == 'push'
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker push "$tag"
          done