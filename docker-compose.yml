services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usta
      POSTGRES_USER: usta
      POSTGRES_PASSWORD: usta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usta -d usta"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    environment:
      SECRET_KEY: faqat-lokal-sinov-uchun-kalit-productionda-almashtiring-1234567890
      DATABASE_URL: postgres://usta:usta@db:5432/usta
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      HTTPS: "False"
      LOG_LEVEL: INFO
    volumes:
      # Yuklangan rasmlar container qayta yaratilganda yo'qolmasligi uchun
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    # Paketlar faqat package-lock.json o'zgarganda qayta o'rnatiladi, qolgan safar darhol ishga tushadi
    command: >
      sh -c "cmp -s package-lock.json node_modules/.lock-nusxa ||
             (npm ci --no-audit --no-fund && cp package-lock.json node_modules/.lock-nusxa);
             exec npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY: http://web:8000
      # Windows papkasi Docker'ga ulanganda fayl o'zgarishi signallari kelmaydi — polling yoqiladi
      VITE_POLLING: "1"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
  frontend_node_modules:
