services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usta
      POSTGRES_USER: usta
      POSTGRES_PASSWORD: usta
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usta -d usta"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    environment:
      SECRET_KEY: faqat-lokal-sinov-uchun-kalit-productionda-almashtiring-1234567890
      DATABASE_URL: postgres://usta:usta@db:5432/usta
      ALLOWED_HOSTS: localhost,127.0.0.1
      HTTPS: "False"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data: